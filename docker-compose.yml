services:
  web:
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ""
        NEXT_SERVER_API_BASE_URL: http://api:8787
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: ""
      NEXT_SERVER_API_BASE_URL: http://api:8787
      # Coolify uses this magic variable to expose the web service on port 3000.
      SERVICE_FQDN_WEB_3000: https://anamnesis.042067.xyz
    depends_on:
      api:
        condition: service_started
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  api:
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: "8787"
      COGNEE_SERVICE_URL: http://cognee:8001
      CORS_ORIGINS: https://anamnesis.042067.xyz
      LLM_BASE_URL: ${LLM_BASE_URL:-https://ai.042067.xyz/v1}
      LLM_MODEL: ${LLM_MODEL:-fugu}
      # Set one of these in Coolify (do not commit secrets):
      LLM_API_KEY: ${LLM_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SAKANA_API_KEY: ${SAKANA_API_KEY:-}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-180000}
    depends_on:
      cognee:
        condition: service_started
    expose:
      - "8787"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8787/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  cognee:
    restart: unless-stopped
    build:
      context: ./services/cognee
    environment:
      ANAMNESIS_DATA_DIR: /app/.data
      STABLE_TS_MODEL: ${STABLE_TS_MODEL:-base}
      STABLE_TS_DEVICE: ${STABLE_TS_DEVICE:-}
      STABLE_TS_DOWNLOAD_ROOT: ${STABLE_TS_DOWNLOAD_ROOT:-}
      STABLE_TS_DYNAMIC_QUANTIZATION: ${STABLE_TS_DYNAMIC_QUANTIZATION:-false}
    volumes:
      - cognee-data:/app/.data
    expose:
      - "8001"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=5).status == 200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  cognee-data:
